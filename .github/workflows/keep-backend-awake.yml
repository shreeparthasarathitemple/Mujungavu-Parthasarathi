# Pings the Render backend so the free instance doesn't go to sleep
# (it sleeps after 15 minutes idle, and the first visitor then waits ~1 minute).
name: Keep backend awake

on:
  schedule:
    - cron: '*/5 * * * *' # GitHub may delay scheduled runs, so ping more often than the 15 min limit
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/festivals
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://mujungavu-parthasarathi.onrender.com/api/festivals
